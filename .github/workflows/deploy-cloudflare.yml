name: Deploy linkedlab.eu

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'worker/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedlab-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish existing Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Configure this as a repository secret, not an environment secret or variable.
      - name: Check Cloudflare repository secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN under Repository secrets in hecroigg/linkedlab-web > Settings > Secrets and variables > Actions, then start a new workflow run."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build production site
        run: npm run build
      - name: Check generated site and interactions
        run: npm run check
      - name: Deploy linkedlab-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy
